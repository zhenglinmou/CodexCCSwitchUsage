<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最近请求耗时位置预览</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171717;
      color: #f1f1f1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.035), transparent 38%),
        #171717;
    }

    .workspace {
      width: min(920px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #202020;
      box-shadow: 0 20px 60px rgba(0,0,0,.38);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .instructions {
      min-width: 0;
      color: #c9c9c9;
      font-size: 14px;
      line-height: 20px;
    }

    .instructions strong {
      display: block;
      margin-bottom: 2px;
      color: #f4f4f4;
      font-size: 16px;
    }

    .sample-switcher {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
      padding: 4px;
      border-radius: 10px;
      background: #181818;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 7px;
      padding: 7px 12px;
      background: transparent;
      color: #a9a9a9;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #303030; color: #fff; }
    button[aria-pressed="true"] { background: #3a3a3a; color: #fff; }

    .preview-stage {
      min-height: 164px;
      padding: 28px 18px;
      overflow-x: auto;
      border: 1px solid #333;
      border-radius: 12px;
      background: #111;
    }

    .record {
      --record-width: 615px;
      position: relative;
      width: var(--record-width);
      height: 108px;
      margin: 0 auto;
      overflow: hidden;
      background: #2b2b2b;
      color: #f4f4f4;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .model,
    .timing,
    .age,
    .meta,
    .cost {
      position: absolute;
      white-space: nowrap;
    }

    .model {
      left: 23px;
      top: 31px;
      color: #f5f5f5;
      font-size: 19px;
      font-weight: 650;
      line-height: 24px;
      letter-spacing: -.22px;
    }

    .timing {
      left: 263px;
      top: 30px;
      z-index: 2;
      padding: 1px 4px 2px;
      border-radius: 5px;
      color: #a7a7a7;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      cursor: ew-resize;
      touch-action: none;
    }

    .timing:hover,
    .timing:focus-visible,
    .record[data-dragging="true"] .timing {
      outline: 1px dashed rgba(255,255,255,.52);
      outline-offset: 2px;
      background: rgba(255,255,255,.045);
      color: #d0d0d0;
    }

    .record[data-dragging="true"]::before {
      content: "";
      position: absolute;
      left: var(--guide-x, 0px);
      top: 10px;
      bottom: 10px;
      z-index: 1;
      width: 1px;
      background: rgba(122,162,247,.65);
      pointer-events: none;
    }

    .age {
      right: 35px;
      top: 30px;
      color: #a7a7a7;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
    }

    .meta {
      left: 23px;
      top: 60px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #9f9f9f;
      font-size: 18px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -.1px;
    }

    .cost {
      right: 35px;
      top: 59px;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 25px;
    }

    .divider {
      position: absolute;
      right: 28px;
      bottom: 9px;
      left: 18px;
      height: 1px;
      background: #414141;
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      color: #aaa;
      font-size: 13px;
    }

    .position-readout {
      min-width: 124px;
      color: #ddd;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #8ab4f8;
    }

    .secondary {
      border: 1px solid #3b3b3b;
      background: #282828;
      color: #ddd;
    }

    .hint {
      margin: 12px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 18px;
    }

    @media (max-width: 720px) {
      .workspace { width: 100vw; min-height: 100vh; padding: 18px; border: 0; border-radius: 0; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .controls { grid-template-columns: 1fr auto; }
      .controls input { grid-column: 1 / -1; grid-row: 2; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <div class="toolbar">
      <div class="instructions">
        <strong>拖动“19.0s/6.2s”左右移动</strong>
        耗时始终固定在第一行；也可以用方向键或下方滑杆微调。
      </div>
      <div class="sample-switcher" aria-label="截图样例">
        <button type="button" data-sample="one" aria-pressed="true">截图 1</button>
        <button type="button" data-sample="two" aria-pressed="false">截图 2</button>
      </div>
    </div>

    <section class="preview-stage" aria-label="最近请求预览">
      <article class="record" id="record">
        <span class="model" id="model">gpt-5.6-sol</span>
        <span class="timing" id="timing" role="slider" tabindex="0" aria-label="耗时水平位置" aria-valuemin="0" aria-valuemax="100">19.0s/6.2s</span>
        <span class="age" id="age">刚刚</span>
        <div class="meta">
          <span id="input">输入 196k</span>
          <span id="output">输出 695</span>
          <span id="cache">缓存 194k</span>
        </div>
        <span class="cost" id="cost">$0.1266</span>
        <div class="divider" aria-hidden="true"></div>
      </article>
    </section>

    <div class="controls">
      <span class="position-readout" id="readout">左侧 263px · 50%</span>
      <input id="position" type="range" min="0" max="1000" value="500" aria-label="耗时水平位置微调">
      <button class="secondary" id="center" type="button">恢复居中</button>
      <button class="secondary" id="copy" type="button">复制位置</button>
    </div>
    <p class="hint">位置会自动保存在这个浏览器里。你确定后，把“左侧 px”或百分比告诉我即可。</p>
  </main>

  <script>
    const samples = {
      one: {
        width: 615,
        timing: '19.0s/6.2s',
        age: '刚刚',
        input: '输入 196k',
        output: '输出 695',
        cache: '缓存 194k',
        cost: '$0.1266',
      },
      two: {
        width: 629,
        timing: '18.0s/5.2s',
        age: '2 分钟前',
        input: '输入 198k',
        output: '输出 542',
        cache: '缓存 197k',
        cost: '$0.1180',
      },
    };

    const record = document.getElementById('record');
    const timing = document.getElementById('timing');
    const range = document.getElementById('position');
    const readout = document.getElementById('readout');
    const copyButton = document.getElementById('copy');
    const edge = 18;
    let currentSample = 'one';
    let ratio = Number(localStorage.getItem('request-timing-ratio'));
    if (!Number.isFinite(ratio)) ratio = .5;
    ratio = Math.max(0, Math.min(1, ratio));
    let dragOffset = 0;

    function availableWidth() {
      return Math.max(1, record.clientWidth - timing.offsetWidth - edge * 2);
    }

    function applyRatio(nextRatio, persist = true) {
      ratio = Math.max(0, Math.min(1, Number(nextRatio) || 0));
      const left = edge + availableWidth() * ratio;
      timing.style.left = `${left}px`;
      record.style.setProperty('--guide-x', `${left + timing.offsetWidth / 2}px`);
      range.value = String(Math.round(ratio * 1000));
      timing.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
      const centerPercent = (left + timing.offsetWidth / 2) / record.clientWidth * 100;
      readout.textContent = `左侧 ${Math.round(left)}px · 中心 ${centerPercent.toFixed(1)}%`;
      if (persist) localStorage.setItem('request-timing-ratio', String(ratio));
    }

    function applySample(name) {
      currentSample = samples[name] ? name : 'one';
      const sample = samples[currentSample];
      record.style.setProperty('--record-width', `${sample.width}px`);
      document.getElementById('model').textContent = 'gpt-5.6-sol';
      timing.textContent = sample.timing;
      document.getElementById('age').textContent = sample.age;
      document.getElementById('input').textContent = sample.input;
      document.getElementById('output').textContent = sample.output;
      document.getElementById('cache').textContent = sample.cache;
      document.getElementById('cost').textContent = sample.cost;
      for (const button of document.querySelectorAll('[data-sample]')) {
        button.setAttribute('aria-pressed', button.dataset.sample === currentSample ? 'true' : 'false');
      }
      requestAnimationFrame(() => applyRatio(ratio, false));
    }

    function ratioFromPointer(clientX) {
      const bounds = record.getBoundingClientRect();
      const left = clientX - bounds.left - dragOffset;
      return (left - edge) / availableWidth();
    }

    timing.addEventListener('pointerdown', event => {
      const bounds = timing.getBoundingClientRect();
      dragOffset = event.clientX - bounds.left;
      timing.setPointerCapture(event.pointerId);
      record.dataset.dragging = 'true';
      event.preventDefault();
    });

    timing.addEventListener('pointermove', event => {
      if (!timing.hasPointerCapture(event.pointerId)) return;
      applyRatio(ratioFromPointer(event.clientX));
    });

    const endDrag = event => {
      if (timing.hasPointerCapture(event.pointerId)) timing.releasePointerCapture(event.pointerId);
      delete record.dataset.dragging;
    };
    timing.addEventListener('pointerup', endDrag);
    timing.addEventListener('pointercancel', endDrag);

    timing.addEventListener('keydown', event => {
      const step = event.shiftKey ? .05 : .01;
      if (event.key === 'ArrowLeft') applyRatio(ratio - step);
      else if (event.key === 'ArrowRight') applyRatio(ratio + step);
      else if (event.key === 'Home') applyRatio(0);
      else if (event.key === 'End') applyRatio(1);
      else return;
      event.preventDefault();
    });

    range.addEventListener('input', () => applyRatio(Number(range.value) / 1000));
    document.getElementById('center').addEventListener('click', () => applyRatio(.5));
    document.querySelector('.sample-switcher').addEventListener('click', event => {
      const button = event.target.closest('[data-sample]');
      if (button) applySample(button.dataset.sample);
    });
    copyButton.addEventListener('click', async () => {
      const text = readout.textContent;
      try {
        await navigator.clipboard.writeText(text);
        copyButton.textContent = '已复制';
      } catch {
        copyButton.textContent = text;
      }
      setTimeout(() => { copyButton.textContent = '复制位置'; }, 1400);
    });
    window.addEventListener('resize', () => applyRatio(ratio, false));

    applySample(currentSample);
  </script>
</body>
</html>
